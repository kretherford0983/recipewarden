# ADR 0051: the Python worker. Dependencies are pinned and locked with hashes (uv.lock, SEC-95); licences are
# checked against licences-allowed.txt (ADR 0053). Python 3.13 matches the bundled runtime (build/python.sh).
[project]
name = "rw-worker"
version = "1.0.0"
description = "RecipeWarden Python worker: offline ingredient parsing, USDA matching and site scrapers (ADR 0051)"
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "ingredient-parser-nlp==2.10.0",
    "recipe-scrapers==15.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.*",
    "pytest-cov==7.*",
    "ruff>=0.15,<0.18",
    "pip-audit==2.*",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["req(id): requirement or acceptance criterion covered (traceability)"]

[tool.coverage.run]
source = ["rw_worker"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
