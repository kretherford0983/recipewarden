# SEC-80: version updates for NuGet and GitHub Actions (alerts are enabled in repo settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      tests:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "coverlet*"]
    ignore:
      # Stay on the .NET 10 LTS line (stack decision); majors need an ADR.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
