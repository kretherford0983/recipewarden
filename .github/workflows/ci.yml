# Section 9.9: CI for the public repository (ADR 0005). Target: under 8 minutes.
# Runs on work in progress (feature/*, hotfix/*) and on every pull request into develop or main.
# Gates: branch flow (promotion-rules), build with warnings as errors, all tests, coverage (NFR-06),
# vulnerable packages (SEC-81), secrets (SEC-83), installer container tests. Actions pinned to SHAs (SEC-84).
# Packages are built by build.yml when code lands in develop or main (docs/branching.md).
name: ci

on:
  push:
    branches: ["feature/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  promotion:
    name: promotion-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check branch flow and version
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: bash build/check-promotion.sh "$BASE" "$HEAD"

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RecipeWarden.slnx

      - name: Build (warnings are errors)
        run: dotnet build RecipeWarden.slnx --no-restore --configuration Release

      - name: Test with coverage gates (NFR-06)
        run: build/test.sh --no-build --configuration Release

      - name: Vulnerable packages (SEC-81)
        run: build/check-vulnerable.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (SEC-83)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck deploy/install.sh tests/installer/test-install.sh build/*.sh
      - name: Installer tests in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash /src/tests/installer/test-install.sh
